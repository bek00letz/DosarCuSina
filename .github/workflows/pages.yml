# Publishes site/ (the privacy policy and help pages the App Store links to) with GitHub
# Pages, at https://bek00letz.github.io/DosarCuSina/.
#
# Pages serves a branch only from its root or from docs/, which holds the project's own
# documents, so the site has a folder of its own and is deployed by this workflow. The
# repository's Pages setting must be Source: "GitHub Actions" (Settings › Pages). Until
# Pages is turned on, a run says so and publishes nothing; after turning it on, run this
# workflow once by hand (Actions › Pages › Run workflow).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer one waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(gh api "repos/$REPOSITORY/pages" --silent -i 2>/dev/null | head -1 | awk '{print $2}' || true)
          if [[ $status == 200 ]]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          elif [[ $status == 404 ]]; then
            echo "::notice::GitHub Pages isn't turned on for this repository yet, so nothing was published. Turn it on with Source: GitHub Actions, then run this workflow again."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Couldn't read the repository's Pages setting (HTTP ${status:-no answer})."
            exit 1
          fi

      - name: Check out the site
        if: steps.pages.outputs.on == 'true'
        uses: actions/checkout@v7

      - name: Set up Pages
        if: steps.pages.outputs.on == 'true'
        uses: actions/configure-pages@v6

      - name: Package the site
        if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish
        id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v5
