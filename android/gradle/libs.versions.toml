# One place for every version the Android build uses.
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
# The tabs' back stacks: Android's back gesture with its predictive animation, each entry's state kept.
navigation3 = "1.2.2"
junit = "6.1.3"
# JSON trees that keep a number's text as written, for values a newer version wrote.
kotlinx-serialization = "1.13.0"
# detekt 2 is the first built for Kotlin 2.4 and AGP 9; 1.23.8 stops at Kotlin 2.0.
detekt = "2.0.0-alpha.6"
# The household database: Room 3 (Kotlin first, coroutines, a SQLite driver of its own) on the
# SQLite it bundles, so the same store runs on the phone and in the JVM tests.
room = "3.0.3"
sqlite = "2.7.1"
# Room's code generation. KSP 2.3 is built apart from Kotlin's versions.
ksp = "2.3.14"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
# Material's rounded icons, matched to the iPhone app's SF Symbols (DSSymbol); R8 keeps only those drawn.
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
